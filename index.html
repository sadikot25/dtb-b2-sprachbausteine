<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprachbausteine DTB B2 · Tagesplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1f2328;--muted:#5d636b;--line:#e3ded3;--accent:#1d5c63;--accent-soft:#e3efef;
--good:#2e7d32;--good-soft:#e7f3e8;--bad:#b23b2e;--bad-soft:#f8e7e4;--mark:#fff2c2}
@media (prefers-color-scheme:dark){:root{--bg:#15181c;--card:#1e2227;--ink:#e8e6e1;--muted:#a3a8ae;--line:#30363d;--accent:#6fb8bf;
--accent-soft:#203538;--good:#7cc47f;--good-soft:#1f3322;--bad:#e88a7f;--bad-soft:#3a2321;--mark:#4a4220}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,system-ui,sans-serif}
header{padding:36px 20px 18px;text-align:center}
header h1{font-family:"Source Serif 4",Georgia,serif;font-size:clamp(26px,5vw,40px);margin:0 0 6px;line-height:1.15}
header p{color:var(--muted);margin:0 auto;max-width:640px}
.countdown{display:inline-block;margin-top:12px;background:var(--accent);color:#fff;font-weight:600;padding:6px 16px;border-radius:999px;font-size:14px}
main{max-width:920px;margin:0 auto;padding:10px 16px 80px}
.tabs{display:flex;gap:8px;justify-content:center;margin:8px 0 18px}
.tabs button{font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 6px}
.progress div{height:100%;background:var(--good);width:0;transition:width .3s}
.pmeta{font-size:13px;color:var(--muted);text-align:center;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{font:inherit;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer;position:relative}
.day:hover{border-color:var(--accent)}
.day .n{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.day .d{font-weight:700;font-size:16px}
.day .f{font-size:13px;color:var(--muted);line-height:1.35;margin-top:4px}
.day.today{border:2px solid var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.day.done{background:var(--good-soft)}
.day .badge{position:absolute;top:8px;right:10px;font-size:12px;font-weight:700}
.day.today .badge{color:var(--accent)} .day.done .badge{color:var(--good)}
.day.exam{background:var(--mark)}
section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:0 0 18px}
h2{font-family:"Source Serif 4",Georgia,serif;font-size:26px;margin:0 0 6px}
h3{font-size:17px;margin:4px 0 10px}
.sub{color:var(--muted);margin:0 0 4px}
.back{font:inherit;color:var(--accent);background:none;border:0;cursor:pointer;font-weight:600;padding:0;margin-bottom:12px}
.learn ul{margin:6px 0;padding-left:20px} .learn li{margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
mark{background:var(--mark);color:inherit;padding:0 3px;border-radius:3px;font-weight:600}
.tip{background:var(--mark);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:15px}
.q{border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.q .tag{font-size:12px;font-weight:700;color:var(--accent)}
.q p{margin:4px 0 10px;font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--accent)}
.right{background:var(--good-soft)!important;border-color:var(--good)!important;color:var(--good)!important;font-weight:600}
.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important;color:var(--bad)!important}
.opts button:disabled{cursor:default}
.expl{display:none;margin-top:10px;font-size:15px;padding:9px 12px;border-radius:8px;background:var(--accent-soft)}
.q.done .expl{display:block}
.letter{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:18px;line-height:2.1;font-size:16px}
.letter select{font:inherit;font-size:15px;padding:2px 4px;border-radius:6px;border:2px solid var(--accent);background:var(--card);color:var(--ink)}
.letter select.right,.letter select.wrong{border-width:2px}
.box{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.box span{border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:14px;font-weight:600;background:var(--card)}
.gapno{font-size:12px;font-weight:700;color:var(--accent);vertical-align:super}
.g2{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.g2 label{display:block;cursor:pointer;padding:2px 0}
.btn{font:inherit;font-weight:600;padding:9px 16px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer;margin:8px 8px 0 0}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
.result{font-weight:700;margin-top:10px}
.mexpl{font-size:14px;margin-top:10px;display:none} .mexpl.show{display:block}
.mexpl li{margin:3px 0}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent);margin-left:6px}
.score{position:sticky;bottom:12px;margin:16px auto 0;width:max-content;background:var(--accent);color:#fff;padding:7px 18px;border-radius:999px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.flash button{font:inherit;min-height:76px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;padding:10px}
.flash button.flip{background:var(--accent-soft);color:var(--accent);font-weight:600}
.check li{list-style:none;margin:6px 0} .check{padding-left:0}
.filter{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin:6px 0}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 20px 40px}
@media (max-width:560px){section.card{padding:16px}.letter{padding:12px;line-height:2.2}}
</style>
</head>
<body>
<header>
  <h1>Sprachbausteine DTB B2</h1>
  <p>16-Tage-Plan bis zur Prüfung am 13.11.2026. Wähle das Datum und starte deine Session.</p>
  <div class="countdown" id="countdown"></div>
</header>
<main>
  <div class="tabs"><button id="tPlan" class="on">Tagesplan</button><button id="tHard">Schwere Übungen</button><button id="tCheat">Spickzettel</button></div>
  <div id="view"></div>
</main>
<footer>DTB B2 Vorbereitung · <span id="sync">Fortschritt wird in diesem Browser gespeichert.</span></footer>

<script>
/* ---------- storage ---------- */
const KEY='dtb-sb-v1';
let S={done:{},scores:{},wrong:[]};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
let cloud=null,saveT=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(cloud){clearTimeout(saveT);saveT=setTimeout(()=>{cloud.set({json:JSON.stringify(S),at:Date.now()}).catch(()=>{});},800);}}
/* cloud sync (only on claude.ai; GitHub version uses this browser only) */
(async()=>{try{
  if(!window.claude||!claude.use)return;
  const db=await claude.use('db'),user=await claude.use('user');if(!db||!user)return;
  const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/state');
  const timeout=new Promise(r=>setTimeout(()=>r(null),10000));
  const snap=await Promise.race([ref.get(),timeout]);
  cloud=ref;
  const remote=snap&&(snap.data?snap.data():snap);
  if(remote&&remote.json){const r=JSON.parse(remote.json);
    if(Object.keys(r.done||{}).length>=Object.keys(S.done).length||r.wrong.length>=S.wrong.length){S=Object.assign({done:{},scores:{},wrong:[]},r);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}route();}
    else save();}
  else if(Object.keys(S.done).length||S.wrong.length) save();
  const st=document.getElementById('sync');if(st)st.textContent='☁️ Fortschritt wird auf allen Geräten synchronisiert.';
}catch(e){}})();

/* ---------- dates ---------- */
const START=new Date(2026,9,28), EXAM=new Date(2026,10,13);
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
function dayDate(i){return new Date(2026,9,28+i);}
function fmt(d){return WD[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';}
function todayIdx(){const t=new Date();t.setHours(0,0,0,0);return Math.round((t-START)/864e5);}

/* ---------- content ---------- */
// MC item: [sentence, options, correctIndex, explanation]
const DAYS=[
{focus:'Konjunktion oder Adverb?',min:20,
learn:`<p><b>Die wichtigste Regel für Teil 1:</b> Schau, wo das Verb steht.<br><em>The most important rule: look where the verb is.</em></p>
<table><tr><th>Verb steht …</th><th>Wort</th><th>Beispiel</th></tr>
<tr><td>am <b>Ende</b></td><td>Konjunktion: weil, da, obwohl, damit, sodass, wenn, sobald, nachdem, bevor</td><td>…, <mark>weil</mark> der Lieferant Probleme <b>hat</b>.</td></tr>
<tr><td><b>direkt nach</b> der Lücke</td><td>Adverb: deshalb, daher, trotzdem, außerdem, dann</td><td><mark>Deshalb</mark> <b>können</b> wir nicht liefern.</td></tr></table>
<div class="tip">Merksatz: <b>weil = Verb am Ende · deshalb = Verb danach.</b> Same meaning, different word order.</div>`,
q:[
['Wir können den Termin nicht einhalten, ___ unser Lieferant Probleme hat.',['weil','deshalb','trotzdem'],0,'Verb am Ende (hat) → Konjunktion <b>weil</b>.'],
['Unser Lieferant hat Probleme. ___ können wir den Termin nicht einhalten.',['Weil','Deshalb','Obwohl'],1,'Verb direkt nach der Lücke (können) → Adverb <b>deshalb</b>.'],
['___ ich mehrmals angerufen habe, hat sich niemand gemeldet.',['Obwohl','Trotzdem','Deshalb'],0,'Verb am Ende (habe) + Gegensatz → <b>obwohl</b> (although).'],
['Ich habe mehrmals angerufen. ___ hat sich niemand gemeldet.',['Obwohl','Trotzdem','Weil'],1,'Verb danach (hat) + Gegensatz → <b>trotzdem</b> (nevertheless).'],
['Bitte schicken Sie mir die Unterlagen, ___ ich den Antrag rechtzeitig stellen kann.',['damit','deshalb','um'],0,'Ziel + Verb am Ende → <b>damit</b> (so that). <em>um</em> braucht <em>zu</em> + Infinitiv.'],
['Die Maschine war defekt, ___ die Produktion zwei Tage stillstand.',['sodass','deshalb','damit'],0,'Folge + Verb am Ende (stillstand) → <b>sodass</b>. Mit deshalb: „deshalb stand die Produktion still“.'],
['___ ich die Ware erhalten habe, melde ich mich bei Ihnen.',['Sobald','Dann','Außerdem'],0,'Verb am Ende (habe) + Zeit → <b>sobald</b> (as soon as).'],
['Die Lieferung kam zu spät. ___ fehlten zwei Kartons.',['Außerdem','Obwohl','Weil'],0,'Verb danach (fehlten) + zusätzliche Info → <b>außerdem</b> (in addition).']]},

{focus:'Präpositionen: Grund und Zeit',min:20,
learn:`<p>Wenn nach der Lücke ein <b>Nomen</b> (mit Artikel) kommt und kein Verb, brauchst du eine <b>Präposition</b>.<br><em>Noun after the gap = preposition.</em></p>
<table><tr><th>Präposition</th><th>Kasus</th><th>Bedeutung</th></tr>
<tr><td>aufgrund / wegen</td><td>Genitiv</td><td>because of</td></tr>
<tr><td>trotz</td><td>Genitiv</td><td>despite</td></tr>
<tr><td>innerhalb</td><td>Genitiv / von</td><td>within</td></tr>
<tr><td>während</td><td>Genitiv</td><td>during</td></tr>
<tr><td>seit</td><td>Dativ</td><td>since / for (past → now)</td></tr>
<tr><td>ab</td><td>Dativ</td><td>from … on (future)</td></tr>
<tr><td>bis (zum)</td><td></td><td>until</td></tr>
<tr><td>zwischen</td><td>Dativ</td><td>between</td></tr></table>`,
q:[
['___ eines technischen Problems ist unsere Website heute nicht erreichbar.',['Aufgrund','Weil','Da'],0,'Nomen im Genitiv (eines Problems) → <b>aufgrund</b>.'],
['___ des schlechten Wetters fand das Treffen statt.',['Trotz','Wegen','Während'],0,'Schlechtes Wetter, aber das Treffen fand statt = Gegensatz → <b>trotz</b>.'],
['Bitte antworten Sie ___ einer Woche.',['innerhalb','seit','bis'],0,'Frist (deadline) → <b>innerhalb</b> einer Woche.'],
['___ der Besprechung sind die Handys auszuschalten.',['Während','Seit','Innerhalb'],0,'Zeitraum, in dem etwas passiert → <b>während</b> (during).'],
['Ich warte ___ drei Wochen auf eine Antwort.',['seit','vor','ab'],0,'Begann in der Vergangenheit und dauert noch an → <b>seit</b>.'],
['Das Angebot gilt nur ___ 30. November.',['bis zum','seit dem','innerhalb'],0,'Endpunkt → <b>bis zum</b> 30. November.'],
['___ dem 1. Dezember werde ich in Teilzeit arbeiten.',['Ab','Seit','Während'],0,'Startpunkt in der Zukunft (werde) → <b>ab</b>. seit nur für Vergangenheit bis jetzt.'],
['Die Lieferung erfolgt ___ 8 und 12 Uhr.',['zwischen','von','bis'],0,'<b>zwischen</b> … und … (between … and …).']]},

{focus:'ob, dass, W-Wörter und da(r)-Wörter',min:20,
learn:`<ul>
<li><b>ob</b> = indirekte Ja/Nein-Frage: <em>Ich möchte wissen, <mark>ob</mark> die Stelle frei ist.</em></li>
<li><b>W-Wort</b> bleibt: <em>…, <mark>wann</mark> ich mit einer Antwort rechnen kann.</em></li>
<li><b>dass</b> = Aussage/Tatsache: <em>Ich freue mich, <mark>dass</mark> …</em></li>
</ul>
<p><b>da(r) + Präposition:</b> Lerne das Verb mit Präposition, dann ist das Wort automatisch klar.</p>
<table><tr><th>Verb + Präposition</th><th>da-Wort</th></tr>
<tr><td>sich bedanken für</td><td>dafür</td></tr><tr><td>sich freuen auf (Zukunft)</td><td>darauf</td></tr>
<tr><td>sich freuen über (schon passiert)</td><td>darüber</td></tr><tr><td>sich kümmern um</td><td>darum</td></tr>
<tr><td>denken an</td><td>daran</td></tr><tr><td>rechnen mit</td><td>damit</td></tr></table>`,
q:[
['Ich möchte wissen, ___ die Stelle noch frei ist.',['ob','dass','wann'],0,'Ja/Nein-Frage („Ist die Stelle frei?“) → <b>ob</b>.'],
['Können Sie mir sagen, ___ ich mit einer Entscheidung rechnen kann: noch diese Woche oder erst im Dezember?',['wann','ob','dass'],0,'Frage nach Zeit → <b>wann</b>.'],
['Ich freue mich, ___ Sie sich für unser Angebot interessieren.',['dass','ob','wann'],0,'Tatsache → <b>dass</b>.'],
['Sie haben mir sehr geholfen. ___ möchte ich mich herzlich bedanken.',['Dafür','Darauf','Darüber'],0,'sich bedanken <b>für</b> → <b>dafür</b>.'],
['Wir haben Ihre Beschwerde erhalten und kümmern uns sofort ___.',['darum','dafür','damit'],0,'sich kümmern <b>um</b> → <b>darum</b>.'],
['Bitte denken Sie ___, die Unterlagen mitzubringen.',['daran','darauf','darüber'],0,'denken <b>an</b> → <b>daran</b>.'],
['Ich habe mich sehr ___ gefreut, dass Sie mich eingeladen haben.',['darüber','darauf','dafür'],0,'Einladung ist schon passiert → sich freuen <b>über</b> → <b>darüber</b>.'],
['Leider weiß ich nicht, ___ ich mich wenden soll.',['an wen','ob','dass'],0,'sich wenden <b>an</b> + Person → <b>an wen</b>.']]},

{focus:'Wortpaare + 1. Probetest Teil 1',min:30,
learn:`<table><tr><th>Paar</th><th>English</th></tr>
<tr><td>sowohl … als auch</td><td>both … and</td></tr><tr><td>entweder … oder</td><td>either … or</td></tr>
<tr><td>weder … noch</td><td>neither … nor</td></tr><tr><td>zwar … aber</td><td>admittedly … but</td></tr>
<tr><td>je … desto</td><td>the more … the more</td></tr><tr><td>nicht nur … sondern auch</td><td>not only … but also</td></tr>
<tr><td>zu + Adjektiv (…, um zu)</td><td>too …</td></tr><tr><td>Komparativ + als / genauso … wie</td><td>…er than / as … as</td></tr></table>
<div class="tip">Heute zum ersten Mal: ein ganzer Brief im Prüfungsformat. Stell den Timer auf 10 Minuten.</div>`,
q:[

['Sie können ___ per E-Mail oder telefonisch bestellen.',['entweder','weder','sowohl'],0,'<b>entweder</b> … oder.'],

['___ früher Sie bestellen, desto schneller erhalten Sie die Ware.',['Je','Desto','Wie'],0,'<b>je</b> + Komparativ, desto + Komparativ.'],
['Die Kiste ist ___ schwer, um sie allein zu tragen.',['zu','sehr','als'],0,'<b>zu</b> + Adjektiv, um … zu = too heavy to …'],
['Die neue Software ist schneller ___ die alte.',['als','wie','dann'],0,'Komparativ (schneller) + <b>als</b>.'],
['Die neue Software ist genauso schnell ___ die alte.',['wie','als','so'],0,'genauso … <b>wie</b>.']],
mock:'m1'},

t2:{title:'Unsere Bestellung vom 28. Oktober',
text:`Sehr geehrte Damen und Herren,<br><br>am 28. Oktober haben wir bei Ihnen 50 Druckerpatronen {1}. Laut Ihrer Auftragsbestätigung sollte die Ware spätestens am 5. November {2}.<br><br>Bis heute haben wir die Lieferung jedoch nicht erhalten, obwohl Sie uns den Termin {3} hatten. Da wir die Patronen dringend benötigen, bitten wir Sie, die Ware {4} zu liefern.<br><br>Sollte das nicht möglich sein, sehen wir uns leider gezwungen, {5}. Wir bitten Sie, sich {6} mit uns in Verbindung zu setzen.<br><br>Mit freundlichen Grüßen<br>Büro Hansen & Partner`,

const HARD={h1:{t1:{title:'Meine Bewerbung als Buchhalterin vom 12. September',
text:`Sehr geehrte Frau Hartmann,<br><br>{1} ich Ihnen meine Unterlagen am 12. September geschickt hatte, erhielt ich zwei Tage später eine Eingangsbestätigung. {2} sind sechs Wochen vergangen, ohne dass ich etwas von Ihnen gehört habe.<br><br>Mir ist bewusst, dass die Auswahl der Bewerberinnen und Bewerber viel Zeit in Anspruch nimmt. {3} möchte ich höflich nachfragen, wie der aktuelle Stand ist.<br><br>{4} einer Umstrukturierung wird meine jetzige Stelle zum 31. Dezember gestrichen. {5} ist es für mich wichtig zu wissen, ob ich noch mit einer Einladung zum Vorstellungsgespräch rechnen kann.<br><br>{6} ich eine Zusage von Ihnen erhalte, kann ich die Stelle kurzfristig antreten.<br><br>Für Ihre Rückmeldung bedanke ich mich im Voraus.<br><br>Mit freundlichen Grüßen<br>Fatema Sadikot`,
box:['AUFGRUND','DAHER','DENNOCH','INZWISCHEN','NACHDEM','OB','SOBALD','STATTDESSEN','TROTZ','WEDER'],
ans:['e','d','c','a','b','g'],
ex:['Verb am Ende + <b>Plusquamperfekt</b> (geschickt hatte) → <b>nachdem</b>. Das ist die typische Zeitform nach „nachdem“.',

'Verb am Ende + <b>Präsens</b> (erhalte) + Zukunft → <b>sobald</b>. „Nachdem“ ist schon bei Lücke 1 und braucht eine Vergangenheitsform.']},
t2:{title:'Ihre Anfrage zu unseren Schulungen',
text:`Sehr geehrter Herr Wolff,<br><br>vielen Dank für Ihre Anfrage vom 20. Oktober. {1} Ihrem Wunsch senden wir Ihnen anbei unser aktuelles Schulungsangebot.<br><br>Die Seminare finden {2} in unseren Räumen in Berlin-Mitte oder direkt bei Ihnen vor Ort statt. Bei mehr als zehn Teilnehmenden {3} wir Ihnen einen Preisnachlass von 8 %. Die Kosten für Unterlagen und Verpflegung sind {4}.<br><br>Eine kostenlose Stornierung ist bis 14 Tage vor Seminarbeginn möglich, {5} berechnen wir 50 % der Kursgebühr.<br><br>Wir würden uns freuen, Sie bald {6} unseren Kunden zählen zu dürfen.<br><br>Mit freundlichen Grüßen<br>Akademie Weitblick`,

h2:{name:'Rückfragen zur Stellenanzeige + Angebot Messestand',t1:{title:'Ihre Stellenanzeige „Sachbearbeitung Lohnbuchhaltung“',
text:`Sehr geehrter Herr Krause,<br><br>{1} Ihrer Stellenanzeige vom 15. Oktober habe ich noch einige Fragen.<br><br>Sie schreiben, dass Erfahrung mit DATEV erwünscht ist. Ich habe {2} drei Jahre mit SAP gearbeitet, mit DATEV {3} nur in einer Schulung. {4} Sie es wünschen, besuche ich vor Arbeitsbeginn gern einen weiteren Kurs.<br><br>Außerdem möchte ich wissen, ob die Stelle unbedingt in Vollzeit besetzt werden muss. Ich betreue zurzeit meine Mutter, {5} ich nachmittags nur eingeschränkt verfügbar bin.<br><br>Ich freue mich auf Ihre Antwort und stehe Ihnen {6} weitere Fragen gern zur Verfügung.<br><br>Mit freundlichen Grüßen<br>Fatema Sadikot`,

'<b>bereits</b> = already. Steht im Mittelfeld nach dem Verb.',
'Gegensatz zu SAP, im Mittelfeld: mit DATEV <b>jedoch</b> nur … (however). Konnektoren wie jedoch können auch mitten im Satz stehen!',

h3:{name:'Rückfrage zum Vorstellungsgespräch + Reinigungsangebot',t1:{title:'Rückfrage zu meinem Vorstellungsgespräch am 20. November',
text:`Sehr geehrte Frau Lorenz,<br><br>vielen Dank für die Einladung zum Vorstellungsgespräch. Ich habe mich sehr {1} gefreut.<br><br>Sie schreiben, dass ich eine Arbeitsprobe mitbringen soll. Leider ist mir nicht ganz klar, {2} genau Sie damit meinen. Soll ich eine Präsentation vorbereiten, {3} reicht es, wenn ich Beispiele aus meiner bisherigen Tätigkeit zeige?<br><br>{4} ich mit öffentlichen Verkehrsmitteln anreise, wüsste ich gern, wie lange das Gespräch ungefähr dauert. Ich muss nämlich spätestens um 17 Uhr wieder in Berlin sein, {5} ich mein Kind rechtzeitig abholen kann.<br><br>Ich hoffe, dass das kein Problem ist, und freue mich schon {6}, Sie kennenzulernen.<br><br>Mit freundlichen Grüßen<br>Fatema Sadikot`,

t2:{title:'Ihre Anfrage vom 28. Oktober',
text:`Sehr geehrter Herr Demir,<br><br>wir bedanken uns für Ihr Interesse an unseren Dienstleistungen. {1} unser Telefonat erhalten Sie anbei ein Angebot für die Reinigung Ihrer Büroräume.<br><br>Unser Team reinigt Ihre Räume {2} montags bis freitags nach 18 Uhr. Die Reinigung der Fenster ist im Preis nicht enthalten, kann aber {3} hinzugebucht werden. Wir {4} großen Wert auf umweltfreundliche Reinigungsmittel.<br><br>Gern führen wir zunächst eine kostenlose Probereinigung durch, damit Sie sich von der Qualität unserer Arbeit {5} können.<br><br>Wir würden uns freuen, wenn unser Angebot Ihren {6} entspricht.<br><br>Mit freundlichen Grüßen<br>Glanzwerk Gebäudeservice`,

h4:{name:'Nachfrage zur Bewerbung + Übersetzungsangebot',t1:{title:'Meine Bewerbung als Kundenberaterin, Ihr Zeichen KB-2026-14',
text:`Sehr geehrte Damen und Herren,<br><br>am 2. Oktober habe ich mich bei Ihnen beworben und am 5. Oktober eine automatische Eingangsbestätigung erhalten. {1} habe ich keine weitere Nachricht bekommen.<br><br>Ich möchte Sie nicht drängen, {2} wäre ich Ihnen dankbar, wenn Sie mir den aktuellen Stand mitteilen könnten. Ich frage auch deshalb nach, {3} ich ein weiteres Angebot erhalten habe. Dieses muss ich {4} Ende nächster Woche annehmen oder ablehnen.<br><br>Ihre Stelle interessiert mich {5} mehr, da sie besser zu meiner Qualifikation passt. Sollten Sie noch Unterlagen benötigen, schicke ich Ihnen diese {6} zu.<br><br>Mit freundlichen Grüßen<br>Fatema Sadikot`,

text:`Sehr geehrter Herr Baumann,<br><br>{1} Ihre Zusage vom 25. Oktober habe ich mich sehr gefreut. Bevor ich den Arbeitsvertrag unterschreibe, möchte ich {2} einige Punkte klären.<br><br>Im Vertrag steht, dass die Probezeit sechs Monate beträgt. Im Vorstellungsgespräch hatten wir {3} über drei Monate gesprochen. Könnten Sie mir bitte erklären, {4} es zu dieser Änderung gekommen ist?<br><br>Außerdem möchte ich wissen, ab wann ich meinen Firmenlaptop erhalte, {5} ich mich schon vor Arbeitsbeginn in Ihr System einarbeiten kann.<br><br>Ich freue mich sehr {6} die Zusammenarbeit.<br><br>Mit freundlichen Grüßen<br>Fatema Sadikot`,

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const view=$('#view');
const L='abcdefghij';
function setScore(day,key,val){S.scores[day]=S.scores[day]||{};S.scores[day][key]=val;save();}
function addWrong(item){if(!S.wrong.some(w=>w.id===item.id)){S.wrong.push(item);save();}}

/* countdown */
(function(){const t=new Date();t.setHours(0,0,0,0);const d=Math.round((EXAM-t)/864e5);
$('#countdown').textContent=d>1?`Noch ${d} Tage bis zur Prüfung`:d===1?'Morgen ist Prüfung!':d===0?'Heute ist Prüfung. Viel Erfolg!':'Prüfung vorbei';})();

/* ---------- plan view ---------- */
function renderPlan(){
  const ti=todayIdx(); const done=Object.keys(S.done).length;
  let h=`<div class="progress"><div style="width:${done/DAYS.length*100}%"></div></div><div class="pmeta">${done} von ${DAYS.length} Sessions erledigt</div><div class="grid">`;
  DAYS.forEach((d,i)=>{
    const dt=dayDate(i), isT=i===ti, isD=S.done[i];
    h+=`<button class="day${isT?' today':''}${isD?' done':''}" data-i="${i}"><span class="badge">${isD?'✓ '+(S.done[i].s||''):isT?'HEUTE':''}</span><div class="n">Tag ${i+1}</div><div class="d">${fmt(dt)}</div><div class="f">${d.focus}<br>≈ ${d.min} Min.</div></button>`;
  });
  h+=`<button class="day exam${ti===16?' today':''}" data-i="exam"><span class="badge">${ti===16?'HEUTE':''}</span><div class="n">Prüfung</div><div class="d">${fmt(EXAM)}</div><div class="f">Schriftliche Prüfung · Hartnackschule</div></button></div>`;
  if(ti>=0&&ti<DAYS.length) h+=`<p style="text-align:center;margin-top:18px"><button class="btn" data-i="${ti}">Heutige Session starten (Tag ${ti+1})</button></p>`;
  if(S.wrong.length) h+=`<p class="pmeta">Fehlerliste: ${S.wrong.length} Einträge (Tag 14) · <button class="back" id="reset">Fortschritt zurücksetzen</button></p>`;
  else h+=`<p class="pmeta"><button class="back" id="reset">Fortschritt zurücksetzen</button></p>`;
  view.innerHTML=h;
  view.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const v=b.dataset.i; v==='exam'?renderExam():renderDay(+v); scrollTo(0,0); location.hash=v==='exam'?'pruefung':'tag-'+(+v+1);});
  $('#reset').onclick=()=>{const bx=$('#reset'); if(bx.dataset.c){S={done:{},scores:{},wrong:[]};save();renderPlan();} else {bx.dataset.c=1;bx.textContent='Wirklich alles löschen? Nochmal klicken.';}};
}

/* ---------- MC block ---------- */
function mcBlock(container,items,dayIdx,prefix,onUpdate){
  let sc=0,ans=0;
  items.forEach((q,i)=>{
    const d=document.createElement('div');d.className='q';
    d.innerHTML=`<div class="tag">${i+1}</div><p>${q[0].replace('___','<mark>___</mark>')}</p><div class="opts"></div><div class="expl">${q[3]}</div>`;
    const o=d.querySelector('.opts');
    const order=q[1].map((t,j)=>j).sort(()=>Math.random()-.5);
    order.forEach(j=>{const b=document.createElement('button');b.textContent=q[1][j];b.dataset.j=j;
      b.onclick=()=>{if(d.classList.contains('done'))return;d.classList.add('done');ans++;
        if(j===q[2]){sc++;b.classList.add('right');}
        else{b.classList.add('wrong');o.querySelector(`[data-j="${q[2]}"]`).classList.add('right');
          addWrong({id:prefix+'-'+i,type:'mc',q:q,from:dayIdx});}
        [...o.children].forEach(x=>x.disabled=true);onUpdate(sc,ans,items.length);};
      o.appendChild(b);});
    container.appendChild(d);});
}

/* ---------- mock block ---------- */
function mockBlock(container,mid,dayIdx,onDone){
  const m=MOCKS[mid]||HARD[mid];
  const wrap=document.createElement('div');
  let h=`<h3>Probetest <span class="timer" id="tm-${mid}"></span></h3><button class="btn ghost" id="ts-${mid}">⏱ 10-Minuten-Timer starten</button>`;
  if(m.t1){h+=`<h3 style="margin-top:16px">Teil 1 · Welche Wörter a–j passen? Jedes Wort nur einmal.</h3><div class="box">${m.t1.box.map((w,i)=>`<span>${L[i]} ${w}</span>`).join('')}</div>
  <div class="letter"><b>Betreff: ${m.t1.title}</b><br><br>${m.t1.text.replace(/\{(\d)\}/g,(x,n)=>`<span class="gapno">${n}</span><select data-t="1" data-g="${n-1}"><option value="">…</option>${m.t1.box.map((w,i)=>`<option value="${L[i]}">${L[i]} ${w}</option>`).join('')}</select>`)}</div>`;}
  if(m.t2){h+=`<h3 style="margin-top:16px">Teil 2 · Welcher Ausdruck (a, b, c) passt?</h3>
  <div class="letter"><b>Betreff: ${m.t2.title}</b><br><br>${m.t2.text.replace(/\{(\d)\}/g,(x,n)=>`<span class="gapno">${n}</span><select data-t="2" data-g="${n-1}"><option value="">…</option>${[0,1,2].sort(()=>Math.random()-.5).map((i,pos)=>`<option value="${i}">${'abc'[pos]}) ${m.t2.opts[n-1][i]}</option>`).join('')}</select>`)}</div>`;}
  h+=`<button class="btn" id="ck-${mid}">Prüfen</button><div class="result" id="rs-${mid}"></div><div class="mexpl" id="ex-${mid}"></div>`;
  wrap.innerHTML=h;container.appendChild(wrap);
  let timer=null;
  wrap.querySelector('#ts-'+mid).onclick=e=>{clearInterval(timer);let t=600;const el=wrap.querySelector('#tm-'+mid);e.target.textContent='⏱ Timer neu starten';
    const tick=()=>{el.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(timer);el.textContent='Zeit ist um!';}};tick();timer=setInterval(tick,1000);};
  wrap.querySelector('#ck-'+mid).onclick=()=>{
    clearInterval(timer);let sc=0,tot=0,ex='<ol>';
    wrap.querySelectorAll('select').forEach(s=>{
      const t=s.dataset.t,g=+s.dataset.g,part=t==='1'?m.t1:m.t2;tot++;
      const correct=t==='1'?part.ans[g]:String(part.ans[g]);
      const ok=s.value===correct;s.classList.remove('right','wrong');s.classList.add(ok?'right':'wrong');if(ok)sc++;
      const corrText=t==='1'?correct+' '+part.box[L.indexOf(correct)]:part.opts[g][+correct];
      if(!ok) addWrong({id:mid+'-'+t+'-'+g,type:'gap',label:`Teil ${t}, Lücke ${g+1} („${part.title}“)`,correct:corrText,ex:part.ex[g],from:dayIdx});
      ex+=`<li>${ok?'✅':'❌'} <b>Teil ${t}, Lücke ${g+1}:</b> ${corrText} · ${part.ex[g]}</li>`;
    });
    ex+='</ol>';
    wrap.querySelector('#rs-'+mid).textContent=`Ergebnis: ${sc} / ${tot}`+(sc===tot?' · Perfekt!':sc>=tot*0.8?' · Sehr gut!':' · Lies die Erklärungen.');
    const e=wrap.querySelector('#ex-'+mid);e.innerHTML=ex;e.classList.add('show');onDone(sc,tot);
  };
}

/* ---------- day view ---------- */
function renderDay(i){
  const d=DAYS[i],dt=dayDate(i);
  view.innerHTML=`<button class="back" id="bk">← Alle Tage</button>
  <section class="card"><div class="sub">Tag ${i+1} von ${DAYS.length} · ${fmt(dt)}2026 · ≈ ${d.min} Min.</div><h2>${d.focus}</h2></section>
  <section class="card learn"><h3>📘 Lernen</h3>${d.learn}</section><div id="parts"></div>
  <section class="card"><button class="btn" id="fin">Session abschließen ✓</button> <span class="sub" id="finmsg"></span></section>
  <div class="score" id="sc">Bereit</div>`;
  $('#bk').onclick=()=>{location.hash='';renderPlan();scrollTo(0,0);};
  const parts=$('#parts');const tally={};
  const upd=()=>{let s=0,t=0;Object.values(tally).forEach(v=>{s+=v[0];t+=v[1];});$('#sc').textContent=t?`${s} / ${t} richtig`:'Bereit';return [s,t];};
  if(d.review){
    const sec=document.createElement('section');sec.className='card';
    const mcW=S.wrong.filter(w=>w.type==='mc'), gapW=S.wrong.filter(w=>w.type==='gap');
    sec.innerHTML=`<h3>🔁 Deine Fehler (${S.wrong.length})</h3>`+(S.wrong.length?'':'<p class="sub">Noch keine Fehler gespeichert. Super, oder du hast die Tage noch nicht gemacht.</p>');
    parts.appendChild(sec);
    if(mcW.length){const c=document.createElement('div');sec.appendChild(c);mcBlock(c,mcW.map(w=>w.q),i,'rev',(s,a,t)=>{tally.rev=[s,t];upd();});}
    if(gapW.length){const l=document.createElement('div');l.innerHTML='<h3 style="margin-top:14px">Fehler aus den Probetests</h3><ol>'+gapW.map(w=>`<li><b>${w.label}:</b> ${w.correct} · ${w.ex}</li>`).join('')+'</ol>';sec.appendChild(l);}
    if(S.wrong.length){const b=document.createElement('button');b.className='btn ghost';b.textContent='Fehlerliste leeren (alles gelernt)';b.onclick=()=>{S.wrong=[];save();renderDay(i);};sec.appendChild(b);}
  }
  if(d.q.length){const sec=document.createElement('section');sec.className='card';sec.innerHTML='<h3>✏️ Übungen</h3>';parts.appendChild(sec);
    mcBlock(sec,d.q,i,'d'+i,(s,a,t)=>{tally.mc=[s,t];upd();});}
  if(d.mock){const sec=document.createElement('section');sec.className='card';parts.appendChild(sec);
    mockBlock(sec,d.mock,i,(s,t)=>{tally.mock=[s,t];upd();});}
  if(d.official){const sec=document.createElement('section');sec.className='card';sec.innerHTML='<h3>📄 Antworten eintragen (Items 46–57)</h3>';parts.appendChild(sec);
    OFFICIAL.forEach((o,k)=>{const w=document.createElement('div');w.className='g2';
      let h=`<b>${o.name}</b><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:8px">`;
      o.ans.forEach((a,n)=>{const opts=n<6?L:'abc';h+=`<label style="display:inline-block">${46+n} <select data-n="${n}"><option value="">…</option>${[...opts].map(x=>`<option>${x}</option>`).join('')}</select></label>`;});
      h+=`</div><button class="btn">Prüfen</button><div class="result"></div>`;w.innerHTML=h;sec.appendChild(w);
      w.querySelector('.btn').onclick=()=>{let s=0;w.querySelectorAll('select').forEach(x=>{const ok=x.value===o.ans[+x.dataset.n];x.classList.remove('right','wrong');x.classList.add(ok?'right':'wrong');if(ok)s++;});
        w.querySelector('.result').textContent=`Ergebnis: ${s} / 12 · Lösung: `+o.ans.map((a,n)=>(46+n)+a).join(' ');tally['o'+k]=[s,12];upd();};});}
  if(d.flash){const sec=document.createElement('section');sec.className='card';
    sec.innerHTML='<h3>🃏 Karteikarten · klick zum Umdrehen</h3><div class="flash">'+PHRASES.map(p=>`<button data-de="${p[0]}" data-en="${p[1]}">${p[0]}</button>`).join('')+'</div>'+
    `<h3 style="margin-top:18px">✅ Checkliste für morgen</h3><ul class="check">${['Ausweis / Pass und Einladung einpacken','Zwei Kugelschreiber + Bleistift + Radiergummi','Uhr ohne Smartwatch-Funktion','Sprachbausteine: max. 10 Minuten, dann Forumsbeitrag','Keine Lücke leer lassen (keine Minuspunkte)','Teil 1: zuerst Verbposition prüfen','Teil 2: Verb/Präposition neben der Lücke entscheidet'].map(t=>`<li><label><input type="checkbox"> ${t}</label></li>`).join('')}</ul>`;
    parts.appendChild(sec);sec.querySelectorAll('.flash button').forEach(b=>b.onclick=()=>{b.classList.toggle('flip');b.textContent=b.classList.contains('flip')?b.dataset.en:b.dataset.de;});}
  $('#fin').onclick=()=>{const [s,t]=upd();S.done[i]={s:t?`${s}/${t}`:'',at:Date.now()};save();$('#finmsg').textContent='Gespeichert! Bis morgen.';};
  if(S.done[i]) $('#finmsg').textContent='Schon erledigt'+(S.done[i].s?' ('+S.done[i].s+')':'')+'. Du kannst die Session wiederholen.';
}

function renderExam(){
  view.innerHTML=`<button class="back" id="bk">← Alle Tage</button><section class="card"><div class="sub">${fmt(EXAM)}2026</div><h2>Prüfungstag</h2>
  <p>Heute keine Übungen. Frühstücken, rechtzeitig losfahren, ruhig bleiben.</p>
  <div class="tip"><b>Sprachbausteine im Kopf:</b><br>Teil 1: Verb am Ende → Konjunktion · Verb danach → Adverb · Nomen → Präposition.<br>Teil 2: Das Verb oder die Präposition neben der Lücke entscheidet.<br>Max. 10 Minuten. Keine Lücke leer lassen.</div>
  <p><b>Viel Erfolg, Fatema! Du schaffst das. 💪</b></p></section>`;
  $('#bk').onclick=()=>{location.hash='';renderPlan();};
}

/* ---------- cheat sheet ---------- */
function renderCheat(){
  view.innerHTML=`<section class="card"><h2>Spickzettel</h2><p class="sub">12 Lücken · 0,5 Punkte pro Lücke · 6 Punkte für Schreiben · max. 10 Minuten</p>
  <h3>Teil 1: Was steht nach der Lücke?</h3>
  <table><tr><th>Nach der Lücke</th><th>Worttyp</th><th>Wörter</th></tr>
  <tr><td>Verb am <b>Ende</b></td><td>Konjunktion</td><td>da, weil, ob, wann, sobald, seitdem, sodass, obwohl, damit, falls, bevor</td></tr>
  <tr><td>Verb <b>direkt danach</b></td><td>Adverb</td><td>daher, deshalb, trotzdem, außerdem, inzwischen, danach, seitdem</td></tr>
  <tr><td>normale Wortstellung</td><td>denn, aber, oder, und</td><td>…, denn ich arbeite …</td></tr>
  <tr><td>Nomen mit Artikel</td><td>Präposition</td><td>aufgrund, wegen, trotz, innerhalb, während, seit, ab, bis, zwischen</td></tr>
  <tr><td>Adjektiv</td><td>Verstärkung</td><td>sehr, besonders, zu</td></tr>
  <tr><td>Verb + Präposition</td><td>da(r)-Wort</td><td>dafür, darauf, darüber, darum, daran, damit</td></tr>
  <tr><td>Paar</td><td>Doppelkonjunktion</td><td>sowohl…als auch · weder…noch · entweder…oder · zwar…aber · je…desto</td></tr></table>
  <h3 style="margin-top:18px">Teil 2: feste Ausdrücke</h3><input class="filter" id="flt" placeholder="Suchen … (z. B. Frist, invoice)">
  <table id="ph"><tr><th>Ausdruck</th><th>English</th></tr>${PHRASES.map(p=>`<tr><td>${p[0]}</td><td>${p[1]}</td></tr>`).join('')}</table></section>`;
  $('#flt').oninput=e=>{const v=e.target.value.toLowerCase();view.querySelectorAll('#ph tr').forEach((r,k)=>{if(k)r.style.display=r.textContent.toLowerCase().includes(v)?'':'none';});};
}

/* ---------- tabs + routing ---------- */
function tab(id){['#tPlan','#tHard','#tCheat'].forEach(t=>$(t).classList.toggle('on',t===id));}
$('#tPlan').onclick=()=>{tab('#tPlan');location.hash='';renderPlan();};
$('#tHard').onclick=()=>{tab('#tHard');location.hash='schwer';renderHard();};
$('#tCheat').onclick=()=>{tab('#tCheat');location.hash='spickzettel';renderCheat();};
function renderHard(){
  view.innerHTML=`<section class="card"><h2>Schwere Übungen</h2><p class="sub">Prüfungsniveau wie im echten Test: Im Kasten stehen mehrere Wörter vom gleichen Typ (daher / dennoch / inzwischen), und in Teil 2 entscheidet die Grammatik (Dativ oder Genitiv, welche Präposition).</p>
  <div class="tip"><b>Strategie:</b> 1) Verbposition prüfen · 2) dann die <b>Logik</b>: Grund, Folge oder Gegensatz? · 3) Zeitform beachten (nachdem + Vergangenheit, sobald + Präsens).</div></section>
  <section class="card"><b>Springe zu:</b> ${Object.keys(HARD).map((k,i)=>`<a href="#" data-go="${k}" style="color:var(--accent);font-weight:600;margin-right:12px">Übung ${i+1}</a>`).join('')}</section>
  ${Object.keys(HARD).map((k,i)=>`<section class="card" id="${k}"><h3>Schwere Übung ${i+1} · ${HARD[k].name||'Bewerbung + Anfrage'}</h3></section>`).join('')}<div class="score" id="sc">Bereit</div>`;
  const tally={};
  Object.keys(HARD).forEach(k=>mockBlock($('#'+k),k,-1,(s,t)=>{tally[k]=[s,t];let a=0,b=0;Object.values(tally).forEach(v=>{a+=v[0];b+=v[1];});$('#sc').textContent=`${a} / ${b} richtig`;}));
  view.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();$('#'+a.dataset.go).scrollIntoView({behavior:'smooth'});});
}
function route(){const h=location.hash.slice(1);const m=h.match(/^tag-(\d+)$/);
  if(m&&+m[1]>=1&&+m[1]<=DAYS.length)renderDay(+m[1]-1);else if(h==='pruefung')renderExam();else if(h==='spickzettel'){$('#tCheat').click();}else if(h==='schwer'){$('#tHard').click();}else renderPlan();}
route();
</script>
